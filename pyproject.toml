[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
description = "Intraday trading system on the Saxo Bank OpenAPI"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
data = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "numpy>=1.26",
]
model = [
    "torch>=2.3",
    "scikit-learn>=1.5",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
]
# Everything the API and its UI backend need: the data layer plus the web stack.
ui = [
    "trader[data,api]",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
trader = "trader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` in the
# signature; B008 (no function calls in argument defaults) does not apply.
"src/trader/api/routes/*" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
